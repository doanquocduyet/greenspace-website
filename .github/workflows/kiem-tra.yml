name: Kiểm tra web — bẫy lỗi đã gặp

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # cần bản gốc để so (lastmod lùi, mất tin có ngày)

      - name: Chọn bản gốc để so
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "main" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=origin/main" >> "$GITHUB_OUTPUT"
          fi

      - name: Tự kiểm bộ lọc quét tin
        run: python3 scripts/quet-tin.py --tu-kiem

      - name: Chạy bẫy
        run: python3 scripts/kiem-tra.py --base-ref "${{ steps.base.outputs.ref }}"
