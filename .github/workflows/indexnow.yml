name: IndexNow — báo trang mới cho search engine

on:
  push:
    branches: [main]
    paths:
      - '**.html'
  workflow_dispatch:   # chạy tay: ping toàn bộ trang

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # cần lịch sử để so file đổi

      - name: Ping IndexNow
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python3 scripts/indexnow.py
