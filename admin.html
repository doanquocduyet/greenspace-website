<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenSpace - Admin Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-green: #2d5a4d;
            --accent-gold: #c9a961;
            --bg-light: #f9f8f6;
            --text-primary: #1a1a1a;
            --text-secondary: #555555;
            --border-light: #e0ddd9;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: linear-gradient(135deg, var(--primary-green) 0%, #4a7d6f 100%);
            color: white;
            padding: 30px 0;
            margin-bottom: 40px;
            box-shadow: var(--shadow-md);
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent-gold);
            color: var(--primary-green);
        }

        .btn-primary:hover {
            background: #d9b878;
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: white;
            color: var(--primary-green);
            border: 2px solid var(--primary-green);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent-gold);
            margin-bottom: 8px;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .table-container {
            background: white;
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--primary-green);
            color: white;
            padding: 16px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid var(--border-light);
            font-size: 13px;
        }

        tr:hover {
            background: var(--bg-light);
        }

        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
            background: var(--accent-gold);
            color: var(--primary-green);
            font-weight: 600;
        }

        .action-btn:hover {
            background: #d9b878;
        }

        .action-btn-delete {
            background: #ef4444;
            color: white;
            margin-left: 4px;
        }

        .action-btn-delete:hover {
            background: #dc2626;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-light);
            padding-bottom: 16px;
        }

        .modal-header h2 {
            font-size: 20px;
            color: var(--primary-green);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .modal-field label {
            font-weight: 600;
            font-size: 13px;
            color: var(--primary-green);
        }

        .modal-field p {
            background: var(--bg-light);
            padding: 12px;
            border-radius: 4px;
            font-size: 13px;
            word-break: break-word;
        }

        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .no-data-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            table {
                font-size: 12px;
            }

            th, td {
                padding: 12px 8px;
            }

            .toolbar {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>GreenSpace Admin Dashboard</h1>
            <p>Quản lý Form Yêu Cầu Tư Vấn</p>
        </div>
    </header>

    <div class="container">
        <div class="toolbar">
            <button class="btn btn-primary" onclick="exportToCSV()">
                <i class="fas fa-download"></i> Xuất Excel
            </button>
            <button class="btn btn-secondary" onclick="refreshData()">
                <i class="fas fa-sync"></i> Làm Mới
            </button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">Tổng Yêu Cầu</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="todayCount">0</div>
                <div class="stat-label">Hôm Nay</div>
            </div>
        </div>

        <div class="table-container">
            <div id="tableContent">
                <div class="no-data">
                    <div class="no-data-icon">⏳</div>
                    <p>Đang tải dữ liệu...</p>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Chi Tiết Yêu Cầu</h2>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyAQNSfm0Rq1K5Z-yJ3v7bQ1W2d4m9pL3t5",
            authDomain: "greenspace-5dbea.firebaseapp.com",
            projectId: "greenspace-5dbea",
            storageBucket: "greenspace-5dbea.appspot.com",
            messagingSenderId: "317634285978",
            appId: "1:317634285978:web:a6d4e2f1c9b8h7g6f5k4"
        };

        let db = null;
        let submissions = [];

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            loadData();
        } catch (e) {
            document.getElementById('tableContent').innerHTML = `
                <div class="no-data">
                    <div class="no-data-icon">❌</div>
                    <p><strong>Firebase initialization error!</strong></p>
                    <p style="margin-top: 10px; font-size: 12px;">${e.message}</p>
                </div>
            `;
        }

        async function loadData() {
            try {
                const querySnapshot = await db.collection('submissions')
                    .orderBy('timestamp', 'desc')
                    .get();
                
                submissions = [];
                querySnapshot.forEach(doc => {
                    submissions.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });

                renderTable(submissions);
                updateStats();
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('tableContent').innerHTML = `
                    <div class="no-data">
                        <div class="no-data-icon">❌</div>
                        <p>Lỗi: ${error.message}</p>
                    </div>
                `;
            }
        }

        function renderTable(data) {
            const tableContent = document.getElementById('tableContent');

            if (data.length === 0) {
                tableContent.innerHTML = `
                    <div class="no-data">
                        <div class="no-data-icon">📋</div>
                        <p>Chưa có yêu cầu nào</p>
                    </div>
                `;
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Họ Tên</th>
                            <th>Số ĐT</th>
                            <th>Email</th>
                            <th>Vị Trí</th>
                            <th>Ngày</th>
                            <th>Hành Động</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.forEach((item, index) => {
                const date = item.timestamp?.toDate?.() || new Date();
                const dateStr = date.toLocaleString('vi-VN');

                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${item.name}</td>
                        <td>${item.phone}</td>
                        <td>${item.email || '-'}</td>
                        <td>${item.location}</td>
                        <td>${dateStr}</td>
                        <td>
                            <button class="action-btn" onclick="showDetail('${item.id}')">
                                <i class="fas fa-eye"></i> Xem
                            </button>
                            <button class="action-btn action-btn-delete" onclick="deleteItem('${item.id}')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            tableContent.innerHTML = html;
        }

        function showDetail(id) {
            const item = submissions.find(x => x.id === id);
            if (!item) return;

            const date = item.timestamp?.toDate?.() || new Date();
            const dateStr = date.toLocaleString('vi-VN');

            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="modal-field">
                    <label>Họ Tên</label>
                    <p>${item.name}</p>
                </div>
                <div class="modal-field">
                    <label>Số Điện Thoại</label>
                    <p>${item.phone}</p>
                </div>
                <div class="modal-field">
                    <label>Email</label>
                    <p>${item.email || '-'}</p>
                </div>
                <div class="modal-field">
                    <label>Vị Trí Đất</label>
                    <p>${item.location}</p>
                </div>
                <div class="modal-field">
                    <label>Mô Tả Chi Tiết</label>
                    <p>${item.message}</p>
                </div>
                <div class="modal-field">
                    <label>Ngày Gửi</label>
                    <p>${dateStr}</p>
                </div>
            `;

            document.getElementById('detailModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        async function deleteItem(id) {
            if (!confirm('Bạn chắc chắn muốn xóa yêu cầu này?')) return;

            try {
                await db.collection('submissions').doc(id).delete();
                loadData();
            } catch (error) {
                alert('Lỗi: ' + error.message);
            }
        }

        function updateStats() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const todayCount = submissions.filter(x => {
                const date = x.timestamp?.toDate?.() || new Date();
                return date >= today;
            }).length;

            document.getElementById('totalCount').textContent = submissions.length;
            document.getElementById('todayCount').textContent = todayCount;
        }

        function refreshData() {
            loadData();
        }

        function exportToCSV() {
            if (submissions.length === 0) {
                alert('Không có dữ liệu để xuất');
                return;
            }

            let csv = 'STT,Họ Tên,Số ĐT,Email,Vị Trí,Mô Tả,Ngày Gửi\n';

            submissions.forEach((item, index) => {
                const date = item.timestamp?.toDate?.() || new Date();
                const dateStr = date.toLocaleString('vi-VN');
                const message = (item.message || '').replace(/,/g, ';').replace(/\n/g, ' ');
                csv += `${index + 1},"${item.name}","${item.phone}","${item.email}","${item.location}","${message}","${dateStr}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `greenspace_form_${new Date().getTime()}.csv`;
            link.click();
        }

        window.onclick = function(event) {
            const modal = document.getElementById('detailModal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
